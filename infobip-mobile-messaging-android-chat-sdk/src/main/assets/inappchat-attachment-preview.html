<!DOCTYPE html>
<html lang="En">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #ib-attachment {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
        }

        img, video {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        audio {
            width: 100%;
        }
    </style>
</head>
<body>
<div id="ib-attachment"></div>
<script>
    const url = getQueryParameter('attachmentUrl');
    const type = getQueryParameter('attachmentType');

    document.getElementById('ib-attachment').innerHTML = buildMediaHtml(url, type);

    function buildMediaHtml(url, type) {
        if (!url) {
            return fileNotFoundHtml();
        }

        const escapedUrl = escapeUrl(url);

        switch (type) {
            case "IMAGE":
                return '<img src="' + escapedUrl + '" />';

            case "VIDEO":
                return '<video src="' + escapedUrl + '" controls playsinline></video>';

            case "AUDIO":
                return '<audio src="' + escapedUrl + '" controls></audio>';

            // DOCUMENT is not handled here, natively by InAppChatAttachmentPreviewActivity instead.

            default:
                return fileNotFoundHtml();
        }
    }

    function fileNotFoundHtml() {
        return '<img src="./file-not-found.png" />';
    }

    function escapeUrl(url) {
        return url.replace(/"/g, '&quot;');
    }

    function getQueryParameter(name) {
        const match = (new RegExp('[?&]' + encodeURIComponent(name) + '=([^&]*)')).exec(location.search);
        return match ? decodeURIComponent(match[1]) : '';
    }
</script>
</body>
</html>
